version: '3.8'

services:
  # Base de Datos Principal
  db-primary:
    image: postgres:15-alpine
    container_name: db-primary
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - ./init-primary.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      postgres -c wal_level=replica 
               -c max_wal_senders=5 
               -c hot_standby=on

  # Base de Datos Réplica (Warm Standby)
  db-replica:
    image: postgres:15-alpine
    container_name: db-replica
    environment:
      PGPASSWORD: password123
    depends_on:
      - db-primary
    command: >
      bash -c "
      until pg_isready -h db-primary -U admin; do sleep 1; done;
      rm -rf /var/lib/postgresql/data/*;
      pg_basebackup -h db-primary -D /var/lib/postgresql/data -U admin -v -P -X stream;
      touch /var/lib/postgresql/data/standby.signal;
      echo 'port = 5432' >> /var/lib/postgresql/data/postgresql.conf;
      exec postgres;
      "

  # Backend App Node A (Primario)
  app-node-a:
    image: python:3.10-slim
    container_name: app-node-a
    command: >
      bash -c "
      pip install flask psycopg2-binary;
      cat <<'EOF' > app.py
      from flask import Flask
      import psycopg2, datetime, os
      app = Flask(__name__)
      DB_HOST = os.getenv('DB_HOST', 'db-primary')
      @app.route('/tx', methods=['POST'])
      def tx():
          try:
              conn = psycopg2.connect(host=DB_HOST, dbname='appdb', user='admin', password='password123', connect_timeout=2)
              cur = conn.cursor()
              cur.execute('INSERT INTO transacciones (created_at) VALUES (%s) RETURNING id;', (datetime.datetime.now(),))
              tx_id = cur.fetchone()[0]
              conn.commit()
              cur.close(); conn.close()
              return f'Node A -> TX {tx_id} OK\n', 200
          except Exception as e:
              return str(e), 500
      app.run(host='0.0.0.0', port=5000)
      EOF
      python app.py
      "
    environment:
      DB_HOST: db-primary

  # Backend App Node B (Secundario / Standby)
  app-node-b:
    image: python:3.10-slim
    container_name: app-node-b
    command: >
      bash -c "
      pip install flask psycopg2-binary;
      cat <<'EOF' > app.py
      from flask import Flask
      import psycopg2, datetime, os
      app = Flask(__name__)
      DB_HOST = os.getenv('DB_HOST', 'db-replica')
      @app.route('/tx', methods=['POST'])
      def tx():
          try:
              conn = psycopg2.connect(host=DB_HOST, dbname='appdb', user='admin', password='password123', connect_timeout=2)
              cur = conn.cursor()
              cur.execute('INSERT INTO transacciones (created_at) VALUES (%s) RETURNING id;', (datetime.datetime.now(),))
              tx_id = cur.fetchone()[0]
              conn.commit()
              cur.close(); conn.close()
              return f'Node B -> TX {tx_id} OK\n', 200
          except Exception as e:
              return str(e), 500
      app.run(host='0.0.0.0', port=5000)
      EOF
      python app.py
      "
    environment:
      DB_HOST: db-replica

  # Balanceador de Carga / Proxy
  load-balancer:
    image: nginx:alpine
    container_name: load-balancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-node-a
      - app-node-b

