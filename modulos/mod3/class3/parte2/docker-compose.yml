version: '3.8'

services:
  # 1. Base de Datos Postgres (Segmentada y con Persistencia)
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Montamos el volumen para persistir datos
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    # NO exponemos el puerto 5432 al exterior (Seguridad estricta)
    networks:
      - red-privada

  # 2. Servidor Backend Node API (El puente de comunicación de red)
  back:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db
    # Pertenece a ambas redes para actuar como puerta de enlace lógica
    networks:
      - red-publica
      - red-privada

  # 3. Servidor Frontend de Producción
  front:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - back
    # Solo puede comunicarse con el Backend, no tiene acceso a la Base de Datos
    networks:
      - red-publica

# ==========================================
# DECLARACIONES DE VOLÚMENES Y REDES
# ==========================================
volumes:
  datos_postgres: # Docker gestionará este espacio persistente de forma segura

networks:
  red-publica:
    driver: bridge # Red para comunicación del front y la API
  red-privada:
    driver: bridge # Red aislada de alta seguridad para la base de datos


