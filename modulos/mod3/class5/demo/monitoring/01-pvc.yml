# prometheus-pv.yml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: labipap
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# grafana-pv.yml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: labipap
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi