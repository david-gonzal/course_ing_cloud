name: Hello-world-Ipap

on:
  push:
    branches: ["integracion"]  
  pull_request:
    branches:
      - main
jobs:
  hola:
    runs-on: ubuntu-latest
    steps:
      - name: Hello-world-Ipap
        run: echo "Hello, wolrd"

      - name: touch file
        run: touch test.txt

      - name: set test.txt
        run: echo "Hola mundo integracion" >> test.txt

      - name: LS
        run: ls -la

      - name: show file
        run: cat -n test.txt
      
      - name: piscaca
        run: echo "Hola mundo a verga como se hace"
        
  otro:
    runs-on: ubuntu-latest
    needs: [hola]
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: LS
        run: ls -la

  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: docker build
        uses: docker/setup-buildx-action@v3

      - name: build image
        uses: docker/build-push-action@v5
        with:
          contex: .
          file: ./Dockerfile
          tags: jgigena90/app-inventario:1.0
